<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Semantic Dark Base Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="40%" stop-color="#10161D"/>
      <stop offset="80%" stop-color="#151C24"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>

    <!-- Restrained Professional Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Border Glow -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Minimal Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#10161D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 900;
      font-size: 54px;
      fill: #F5F7FA;
      letter-spacing: -1px;
    }
    .role-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: #38BDF8;
    }
    .tech-stack-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #C3CBD5;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #8A94A3;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #C3CBD5;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" rx="16" fill="url(#centerGlow)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Semantic Border Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="15" fill="none" stroke="#27313D" stroke-width="1.5"/>

  <!-- Minimal Corner Accents -->
  <!-- Top Left -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <circle cx="24" cy="24" r="2.5" fill="#38BDF8"/>
  
  <!-- Top Right -->
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <circle cx="1176" cy="24" r="2.5" fill="#38BDF8"/>

  <!-- Bottom Left -->
  <path d="M 24 276 L 24 296 L 44 296" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <circle cx="24" cy="296" r="2.5" fill="#38BDF8"/>

  <!-- Bottom Right -->
  <path d="M 1176 276 L 1176 296 L 1156 296" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <circle cx="1176" cy="296" r="2.5" fill="#38BDF8"/>

  <!-- Subtle Circuit Accents Left -->
  <g opacity="0.25">
    <line x1="80" y1="160" x2="150" y2="160" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="150" cy="160" r="3.5" fill="#38BDF8"/>
    <line x1="150" y1="160" x2="180" y2="130" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="180" cy="130" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Subtle Circuit Accents Right -->
  <g opacity="0.25">
    <line x1="1120" y1="160" x2="1050" y2="160" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1050" cy="160" r="3.5" fill="#38BDF8"/>
    <line x1="1050" y1="160" x2="1020" y2="190" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="1020" cy="190" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Central Visual Hierarchy -->
  <g text-anchor="middle">
    <!-- Role Identifier Pill -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#151C24" stroke="#27313D" stroke-width="1"/>
      <circle cx="-110" cy="0" r="3.5" fill="#38BDF8"/>
      <text x="8" y="5" text-anchor="middle" class="role-badge">FULL STACK ENGINEER</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="130" class="name-text">Nallana Sasi Kumar</text>

    <!-- Core Stack Line -->
    <text x="600" y="174" class="tech-stack-text">
      React.js  <tspan fill="#38BDF8">•</tspan>  Next.js  <tspan fill="#38BDF8">•</tspan>  Node.js  <tspan fill="#38BDF8">•</tspan>  Express.js  <tspan fill="#38BDF8">•</tspan>  PostgreSQL  <tspan fill="#38BDF8">•</tspan>  Tailwind CSS
    </text>

    <!-- Subtitle Line -->
    <text x="600" y="212" class="tagline-text">
      B.Tech AI &amp; Data Science @ KIET  •  Component-Driven UI  •  Scalable Web Architectures
    </text>

    <!-- Status Indicator Pill -->
    <g transform="translate(600, 260)">
      <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#151C24" stroke="#27313D" stroke-width="1"/>
      <circle cx="-155" cy="0" r="4" fill="#22C55E" filter="url(#subtleGlow)"/>
      <text x="10" y="5" text-anchor="middle" class="status-text">Open to High-Impact Full Stack Engineering Roles</text>
    </g>
  </g>
</svg>
