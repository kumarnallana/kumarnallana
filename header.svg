<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian / Midnight Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="80%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Cyber Cyan / Emerald Gradient -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1"/>
    </pattern>

    <style>
      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 56px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .role {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 20px;
        fill: url(#cyberGradient);
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .status {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #00f2fe;
        letter-spacing: 1.5px;
      }
      @keyframes floatAnimation {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      .floating {
        animation: floatAnimation 5s ease-in-out infinite;
      }
      .pulsing {
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Cyber Tech Grid -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Glowing Accent Orbs -->
  <circle cx="150" cy="80" r="180" fill="#00f2fe" opacity="0.15" filter="url(#neonGlow)" class="pulsing"/>
  <circle cx="1050" cy="240" r="200" fill="#10b981" opacity="0.12" filter="url(#neonGlow)" class="pulsing"/>
  <circle cx="600" cy="160" r="160" fill="#3b82f6" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Sleek Glowing Borders -->
  <rect width="1196" height="316" x="2" y="2" rx="15" fill="none" stroke="url(#cyberGradient)" stroke-width="1.5" opacity="0.4"/>

  <!-- Top Accent Light Bar -->
  <path d="M 200 2 L 1000 2" stroke="url(#cyberGradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Content -->
  <g class="floating">
    <!-- Status Badge Pill -->
    <g transform="translate(460, 48)">
      <rect width="280" height="32" rx="16" fill="#050811" stroke="#00f2fe" stroke-width="1" opacity="0.9"/>
      <circle cx="22" cy="16" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="145" y="21" text-anchor="middle" class="status">AI &amp; FULL-STACK ARCHITECT</text>
    </g>

    <!-- Main Name Heading with Subtle Shadow -->
    <text x="600" y="150" text-anchor="middle" class="name">Sasi Kumar Nallana</text>

    <!-- Subtitle / Tech Expertise -->
    <text x="600" y="200" text-anchor="middle" class="role">Next.js &bull; React &bull; Node.js &bull; AI Engineering</text>

    <!-- Bottom Metric / Tagline -->
    <text x="600" y="245" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" letter-spacing="1.5px">
      Transforming Complex Architectures Into Scalable Production Systems
    </text>
  </g>
</svg>
