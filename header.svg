<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian / Midnight Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="35%" stop-color="#0b1329"/>
      <stop offset="70%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Cyber Cyan / Azure / Emerald Gradient -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Subtle Tech Accent Glow -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Engineering Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>

    <!-- Radial Glow Background -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 900;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .role-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, monospace;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: #00f2fe;
    }
    .tech-stack-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #64748b;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #10b981;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" rx="16" fill="url(#centerGlow)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Border Frame with Ambient Glow -->
  <rect x="2" y="2" width="1196" height="316" rx="15" fill="none" stroke="url(#cyberGradient)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Corner Tech Accents -->
  <!-- Top Left -->
  <path d="M 24 50 L 24 24 L 50 24" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="24" cy="24" r="3" fill="#00f2fe"/>
  
  <!-- Top Right -->
  <path d="M 1176 50 L 1176 24 L 1150 24" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="1176" cy="24" r="3" fill="#00f2fe"/>

  <!-- Bottom Left -->
  <path d="M 24 270 L 24 296 L 50 296" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="24" cy="296" r="3" fill="#10b981"/>

  <!-- Bottom Right -->
  <path d="M 1176 270 L 1176 296 L 1150 296" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="1176" cy="296" r="3" fill="#10b981"/>

  <!-- Decorative Circuit Nodes Left -->
  <g opacity="0.4">
    <line x1="80" y1="160" x2="160" y2="160" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="160" cy="160" r="4" fill="#00f2fe" filter="url(#subtleGlow)"/>
    <line x1="160" y1="160" x2="190" y2="130" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="190" cy="130" r="3" fill="#38bdf8"/>
  </g>

  <!-- Decorative Circuit Nodes Right -->
  <g opacity="0.4">
    <line x1="1120" y1="160" x2="1040" y2="160" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1040" cy="160" r="4" fill="#10b981" filter="url(#subtleGlow)"/>
    <line x1="1040" y1="160" x2="1010" y2="190" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="1010" cy="190" r="3" fill="#34d399"/>
  </g>

  <!-- Central Content Area -->
  <g text-anchor="middle">
    <!-- Top Engineering Pill Badge -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0b1329" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="-112" cy="0" r="4" fill="#00f2fe" filter="url(#subtleGlow)"/>
      <text x="8" y="5" text-anchor="middle" class="role-badge">FULL STACK ENGINEER</text>
    </g>

    <!-- Main Title / Name with Subtle Shadow & Clean Glow -->
    <text x="600" y="130" class="name-text">Nallana Sasi Kumar</text>

    <!-- Core Technology Focus -->
    <text x="600" y="174" class="tech-stack-text">
      React.js  <tspan fill="#00f2fe">•</tspan>  Next.js  <tspan fill="#00f2fe">•</tspan>  Node.js  <tspan fill="#00f2fe">•</tspan>  Express.js  <tspan fill="#00f2fe">•</tspan>  PostgreSQL  <tspan fill="#00f2fe">•</tspan>  Tailwind CSS
    </text>

    <!-- Secondary Capability / Discipline -->
    <text x="600" y="212" class="tagline-text">
      B.Tech AI &amp; Data Science @ KIET  •  Component-Driven UI  •  Scalable Web Architectures
    </text>

    <!-- Live Status / Availability Pill -->
    <g transform="translate(600, 260)">
      <rect x="-195" y="-15" width="390" height="30" rx="15" fill="#051726" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="-165" cy="0" r="4.5" fill="#10b981" filter="url(#subtleGlow)"/>
      <text x="10" y="5" text-anchor="middle" class="status-text">⚡ Open to High-Impact Full Stack Engineering Roles</text>
    </g>
  </g>
</svg>
