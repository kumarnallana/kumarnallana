<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0519"/>
      <stop offset="35%" stop-color="#1e0b36"/>
      <stop offset="70%" stop-color="#3b1366"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Name Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: url(#titleGradient);
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #d8b4fe;
        letter-spacing: 2px;
      }
      .tagline {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #a78bfa;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .dot {
        fill: #38bdf8;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }
      .floating-group {
        animation: float 6s ease-in-out infinite;
      }
      .ambient-pulse {
        animation: pulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Banner Card Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Subtle Border Highlight -->
  <rect width="1198" height="318" x="1" y="1" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="80" r="140" fill="#7c3aed" opacity="0.25" filter="url(#glow)" class="ambient-pulse"/>
  <circle cx="1000" cy="220" r="160" fill="#ec4899" opacity="0.15" filter="url(#glow)" class="ambient-pulse"/>
  <circle cx="600" cy="140" r="180" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>

  <!-- Waving Bottom Curves -->
  <path d="M0,240 C300,290 450,200 750,260 C950,300 1100,240 1200,270 L1200,320 L0,320 Z" fill="url(#wave1)"/>
  <path d="M0,265 C250,215 500,300 800,245 C1000,210 1120,285 1200,285 L1200,320 L0,320 Z" fill="url(#wave2)"/>

  <!-- Content Group -->
  <g class="floating-group">
    <!-- Top Pill Badge -->
    <g transform="translate(470, 45)">
      <rect width="260" height="30" rx="15" fill="#1e0b36" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle cx="20" cy="15" r="4" class="dot"/>
      <text x="135" y="20" text-anchor="middle" class="tagline">FULL-STACK ENGINEER</text>
    </g>

    <!-- Main Name Title -->
    <text x="600" y="145" text-anchor="middle" class="title" filter="url(#glow)">Sasi Kumar Nallana</text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="195" text-anchor="middle" class="subtitle">AI &amp; Data Science &nbsp;•&nbsp; Next.js &amp; React &nbsp;•&nbsp; Product Builder</text>
  </g>
</svg>
